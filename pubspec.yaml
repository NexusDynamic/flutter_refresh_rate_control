name: flutter_refresh_rate_control
description: "A Flutter plugin that requests high refresh rate mode on Android, iOS and macOS devices."
version: 0.1.0+0
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/flutter_refresh_rate_control

environment:
  sdk: ^3.7.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zeyus.flutter_refresh_rate_control
        pluginClass: FlutterRefreshRateControlPlugin
      ios:
        pluginClass: FlutterRefreshRateControlPlugin
      macos:
        pluginClass: FlutterRefreshRateControlPlugin
